# Arranque local de DOCENTIA, mismo esquema que Unilab:
#   docker compose up --build
# Web:  http://localhost:5173
# API:  http://localhost:8080/api
# El perfil dev carga usuarios de ejemplo y un modelo de IA simulado.
# No uses ese perfil fuera de esta máquina.
# network: host en el build: en este Docker Desktop el DNS de la red bridge no resuelve.

name: docentia

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docentia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docentia}
      POSTGRES_DB: ${POSTGRES_DB:-docentia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Solo desarrollo: atrapa los correos para verlos en el navegador.
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  api:
    image: docentia-api
    build:
      context: ./docentia-backend
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DOCENTIA_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-docentia}
      DOCENTIA_DB_USUARIO: ${POSTGRES_USER:-docentia}
      DOCENTIA_DB_CONTRASENA: ${POSTGRES_PASSWORD:-docentia}
      DOCENTIA_JWT_SECRETO: ${DOCENTIA_JWT_SECRETO:-secreto-de-desarrollo-local-no-usar-en-produccion}
      DOCENTIA_GOOGLE_CLIENT_ID: ${DOCENTIA_GOOGLE_CLIENT_ID:-}
      DOCENTIA_BOOTSTRAP_EMAIL: ${DOCENTIA_BOOTSTRAP_EMAIL:-}
      DOCENTIA_BOOTSTRAP_NOMBRE: ${DOCENTIA_BOOTSTRAP_NOMBRE:-}
      DOCENTIA_BOOTSTRAP_CONTRASENA: ${DOCENTIA_BOOTSTRAP_CONTRASENA:-}
      DOCENTIA_APP_URL: ${DOCENTIA_APP_URL:-http://localhost:5173}
      DOCENTIA_MAIL_HOST: ${DOCENTIA_MAIL_HOST:-mailpit}
      DOCENTIA_MAIL_PORT: ${DOCENTIA_MAIL_PORT:-1025}
      DOCENTIA_MAIL_USER: ${DOCENTIA_MAIL_USER:-}
      DOCENTIA_MAIL_PASS: ${DOCENTIA_MAIL_PASS:-}
      DOCENTIA_MAIL_FROM: ${DOCENTIA_MAIL_FROM:-no-responder@uniautonoma.edu.co}
      DOCENTIA_MAIL_TLS: ${DOCENTIA_MAIL_TLS:-false}
      DOCENTIA_COMPROMISOS_UMBRAL: ${DOCENTIA_COMPROMISOS_UMBRAL:-3.8}
      DOCENTIA_ACTAS_ROL_CORRECTOR: ${DOCENTIA_ACTAS_ROL_CORRECTOR:-VICERRECTOR}
      DOCENTIA_IA_HABILITADO: ${DOCENTIA_IA_HABILITADO:-true}
      DOCENTIA_IA_PROVEEDOR: ${DOCENTIA_IA_PROVEEDOR:-local}
      DOCENTIA_IA_URL_BASE: ${DOCENTIA_IA_URL_BASE:-}
      DOCENTIA_IA_MODELO: ${DOCENTIA_IA_MODELO:-}
      DOCENTIA_IA_CLAVE: ${DOCENTIA_IA_CLAVE:-}
      DOCENTIA_IA_ENVIAR_TEMPERATURA: ${DOCENTIA_IA_ENVIAR_TEMPERATURA:-true}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    stop_grace_period: 30s

  web:
    image: docentia-web
    build:
      context: ./DocenteIA
      dockerfile: Dockerfile
      network: host
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_URL_NOVA: ${VITE_URL_NOVA:-}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
