  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

solid #E3C924;outline-offset:2px}\n  @keyframes spin{to{transform:rotate(360deg)}}\n  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}\n  @keyframes pulseDot{0%,100%{opacity:.25}50%{opacity:1}}\n  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"display:flex;min-height:100vh;align-items:stretch\">\n\n  <aside style=\"width:252px;flex:0 0 252px;background:#053686;color:#FFFDF5;display:flex;flex-direction:column;position:sticky;top:0;height:100vh\">\n    <div style=\"padding:22px 20px 18px 20px;border-bottom:1px solid rgba(254,251,244,.16)\">\n      <div style=\"display:flex;align-items:center;gap:10px\">\n        <div style=\"width:34px;height:34px;flex:0 0 34px;border-radius:9px;background:#E3C924;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;color:#022A8A;letter-spacing:-.5px\">DA<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:1px\">\n          <strong style=\"font-size:16px;font-weight:900;letter-spacing:-.3px;line-height:1\">DOCENTIA<\u002Fstrong>\n          <span style=\"font-size:10.5px;opacity:.7;letter-spacing:.09em;text-transform:uppercase;line-height:1\">Evaluación docente<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <nav style=\"padding:16px 12px;display:flex;flex-direction:column;gap:3px;flex:1;overflow:auto\">\n      <div style=\"font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;padding:4px 8px 8px 8px;font-weight:400\">{{ roleLabel }}<\u002Fdiv>\n      <sc-for list=\"{{ navItems }}\" as=\"item\" hint-placeholder-count=\"4\">\n        <button sc-camel-on-click=\"{{ item.go }}\" style=\"display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border:0;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:400;letter-spacing:-.1px;background:{{ item.bg }};color:{{ item.fg }}\">\n          <span style=\"width:6px;height:6px;flex:0 0 6px;border-radius:50%;background:{{ item.dot }}\"><\u002Fspan>\n          <span style=\"flex:1\">{{ item.label }}<\u002Fspan>\n          <sc-if value=\"{{ item.badge }}\" hint-placeholder-val=\"{{ false }}\">\n            <span style=\"font-size:10.5px;font-weight:900;background:#E3C924;color:#022A8A;padding:1px 6px;border-radius:20px\">{{ item.badge }}<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fnav>\n\n    <div style=\"padding:12px;border-top:1px solid rgba(254,251,244,.16)\">\n      <div style=\"font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.55;padding:2px 8px 8px 8px;font-weight:400\">Ver el sistema como<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:4px\">\n        <sc-for list=\"{{ roleOptions }}\" as=\"r\" hint-placeholder-count=\"4\">\n          <button sc-camel-on-click=\"{{ r.go }}\" style=\"padding:7px 8px;border-radius:7px;border:1px solid {{ r.bd }};background:{{ r.bg }};color:{{ r.fg }};font-size:11.5px;font-weight:900;cursor:pointer;text-align:left;letter-spacing:-.1px\">{{ r.short }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:9px;padding:14px 8px 4px 8px\">\n        <div style=\"width:28px;height:28px;flex:0 0 28px;border-radius:50%;background:rgba(254,251,244,.18);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900\">{{ userInitials }}<\u002Fdiv>\n        <div style=\"min-width:0\">\n          <div style=\"font-size:12px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ userName }}<\u002Fdiv>\n          <div style=\"font-size:10.5px;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ userMeta }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <main style=\"flex:1;min-width:0;display:flex;flex-direction:column\">\n\n    <header style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:24px 30px 18px 30px;background:#FFFDF5;border-bottom:2px solid #E6DFCE;position:sticky;top:0;z-index:5\">\n      <div style=\"min-width:0\">\n        <div style=\"font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#66625A;font-weight:900;margin-bottom:5px\">{{ crumb }}<\u002Fdiv>\n        <h1 style=\"margin:0;font-size:26px;font-weight:900;letter-spacing:-.8px;line-height:1.1\">{{ title }}<\u002Fh1>\n        <p style=\"margin:6px 0 0 0;font-size:13.5px;color:#6E6A5E;max-width:62ch;line-height:1.45;text-wrap:pretty\">{{ subtitle }}<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:9px\">\n        <div style=\"display:flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid #E6DFCE;border-radius:8px;background:#fff\">\n          <span style=\"font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:#66625A\">Periodo<\u002Fspan>\n          <strong style=\"font-size:13px;font-weight:900\">{{ periodoSel }}<\u002Fstrong>\n        <\u002Fdiv>\n        <sc-if value=\"{{ showPrimaryAction }}\" hint-placeholder-val=\"{{ true }}\">\n          <button sc-camel-on-click=\"{{ primaryAction }}\" style=\"padding:10px 16px;border:0;border-radius:8px;background:#053686;color:#FFFDF5;font-size:13px;font-weight:900;cursor:pointer;letter-spacing:-.1px;box-shadow:0 1px 2px rgba(5,54,134,.3)\">{{ primaryLabel }}<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <div style=\"padding:26px 30px 48px 30px;flex:1\">\n\n      <!-- ======================= DASHBOARD ADMINISTRATIVO ======================= -->\n      <sc-if value=\"{{ isDash }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:20px\">\n\n          <section style=\"background:#FFFFFF;border:1px solid #E6DFCE;border-radius:10px;padding:15px 16px;box-shadow:0 1px 2px rgba(30,30,30,.04)\">\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:12px\">\n              <div style=\"display:flex;flex-direction:column;gap:6px;min-width:0\">\n                <label for=\"fPeriodo\" style=\"font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:900;color:#66625A\">Periodo académico<\u002Flabel>\n                <sc-raw-select id=\"fPeriodo\" value=\"{{ periodoSel }}\" sc-camel-on-change=\"{{ onPeriodo }}\" style=\"padding:10px 11px;border:1px solid #E6DFCE;border-radius:8px;background:#FFFDF5;font-size:13.5px;font-weight:400;color:#1E1E1E;cursor:pointer;width:100%\">\n                  <sc-for list=\"{{ periodoOptions }}\" as=\"o\" hint-placeholder-count=\"4\">\n                    <option value=\"{{ o }}\">{{ o }}<\u002Foption>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;flex-direction:column;gap:6px;min-width:0\">\n                <label for=\"fFacultad\" style=\"font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:900;color:#66625A\">Facultad<\u002Flabel>\n                <sc-if value=\"{{ esVR }}\" hint-placeholder-val=\"{{ false }}\">\n                  <sc-raw-select id=\"fFacultad\" value=\"{{ facSel }}\" sc-camel-on-change=\"{{ onFac }}\" style=\"padding:10px 11px;border:1px solid #E6DFCE;border-radius:8px;background:#FFFDF5;font-size:13.5px;font-weight:400;color:#1E1E1E;cursor:pointer;width:100%\">\n                    <sc-for list=\"{{ facOptions }}\" as=\"o\" hint-placeholder-count=\"4\">\n                      <option value=\"{{ o }}\">{{ o }}<\u002Foption>\n                    <\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ esCoord }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"display:flex;align-items:center;gap:8px;padding:10px 11px;border:1px solid #E6DFCE;border-radius:8px;background:#F7F3E8\">\n                    <span style=\"font-size:13.5px;font-weight:400;color:#1E1E1E;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ facSel }}<\u002Fspan>\n                    <span style=\"font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:900;color:#66625A;margin-left:auto;white-space:nowrap\">Fijo · tu facultad<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;flex-direction:column;gap:6px;min-width:0\">\n                <label for=\"fPrograma\" style=\"font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:900;color:#66625A\">Programa<\u002Flabel>\n                <sc-raw-select id=\"fPrograma\" value=\"{{ progSel }}\" sc-camel-on-change=\"{{ onProgDash }}\" style=\"padding:10px 11px;border:1px solid #E6DFCE;border-radius:8px;background:#FFFDF5;font-size:13.5px;font-weight:400;color:#1E1E1E;cursor:pointer;width:100%\">\n                  <sc-for list=\"{{ progDashOptions }}\" as=\"o\" hint-placeholder-count=\"3\">\n                    <option value=\"{{ o }}\">{{ o }}<\u002Foption>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;flex-direction:column;gap:6px;min-width:0\">\n                <label for=\"fDocente\" style=\"font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:900;color:#66625A\">Buscar docente<\u002Flabel>\n                <input id=\"fDocente\" value=\"{{ qDash }}\" sc-camel-on-input=\"{{ onQDash }}\" placeholder=\"Nombre o apellido\" style=\"padding:10px 11px;border:1px solid #E6DFCE;border-radius:8px;background:#FFFDF5;font-size:13.5px;font-weight:400;color:#1E1E1E;width:100%\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:13px;padding-top:12px;border-top:1px solid #F1ECDD\">\n              <span style=\"font-size:11.5px;font-weight:900;padding:4px 10px;border-radius:20px;background:#E8EDF8;color:#053686\">Alcance: {{ alcance }}<\u002Fspan>\n              <span style=\"font-size:11.5px;font-weight:300;color:#66625A;line-height:1.45\">La calificación de estudiantes se sincroniza desde el sistema de encuestas institucional; coordinación y vicerrectoría se registran en DOCENTIA.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsection>\n\n          <sc-if value=\"{{ dashCargando }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-direction:column;gap:16px\" role=\"status\" aria-live=\"polite\">\n              <span style=\"position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)\">Cargando resultados<\u002Fspan>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:14px\">\n                <sc-for list=\"{{ skeletons }}\" as=\"sk\" hint-placeholder-count=\"4\">\n                  <div style=\"background:#FFFFFF;border:1px solid #E6DFCE;border-radius:10px;padding:16px\">\n                    <div style=\"height:11px;width:54%;border-radius:4px;background:#F1ECDD;animation:pulseDot 1.4s ease-in-out infinite\"><\u002Fdiv>\n                    <div style=\"height:30px;width:38%;border-radius:5px;background:#F1ECDD;margin-top:14px;animation:pulseDot 1.4s ease-in-out infinite\"><\u002Fdiv>\n                    <div style=\"height:10px;width:78%;border-radius:4px;background:#F1ECDD;margin-top:16px;animation:pulseDot 1.4s ease-in-out infinite\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px\">\n                <div style=\"height:262px;background:#FFFFFF;border:1px solid #E6DFCE;border-radius:10px;animation:pulseDot 1.4s ease-in-out infinite\"><\u002Fdiv>\n                <div style=\"height:262px;background:#FFFFFF;border:1px solid #E6DFCE;border-radius:10px;animation:pulseDot 1.4s ease-in-out infinite\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"height:330px;background:#FFFFFF;border:1px solid #E6DFCE;border-radius:10px;animation:pulseDot 1.4s ease-in-out infinite\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ dashError }}\" hint-placeholder-val=\"{{ false }}\">\n            <section style=\"background:#FFFFFF;border:1px solid #E5B4A6;border-radius:10px;padding:34px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center\" role=\"alert\">\n              <img src=\"4a73c8f1-6650-4b9a-b06b-cf44bb520e46\" alt=\"\" aria-hidden=\"true\" style=\"width:76px;height:auto\">\n              <strong style=\"font-size:16px;font-weight:900;letter-spacing:-.3px\">No fue posible cargar los resultados<\u002Fstrong>\n              <p style=\"margin:0;font-size:13.5px;color:#66625A;max-width:46ch;line-height:1.55;font-weight:300\">La consulta de evaluaciones no respondió. Intenta nuevamente; si el problema continúa, informa a la mesa de servicio.<\u002Fp>\n              <button style=\"padding:11px 18px;border:0;border-radius:8px;background:#053686;color:#FFFDF5;font-size:13.5px;font-weight:900;cursor:pointer\">Intentar de nuevo<\u002Fbutton>\n            <\u002Fsection>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ dashSinDatos }}\" hint-placeholder-val=\"{{ false }}\">\n            <section style=\"background:#FFFFFF;border:1px dashed #D8D0BC;border-radius:10px;padding:34px 24px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center\">\n              <img src=\"dc9465b7-7b97-4bbd-9266-9f1e9eb136ed\" alt=\"\" aria-hidden=\"true\" style=\"width:76px;height:auto\">\n              <strong style=\"font-size:16px;font-weight:900;letter-spacing:-.3px\">Aún no existen evaluac     <h2 style=\"margin:0;font-size:15.5px;font-weight:900;letter-spacing:-.3px\">Resumen de comentarios<\u002Fh2>\n                      <p style=\"margin:3px 0 0 0;font-size:12.5px;color:#66625A;font-weight:300\">Principales hallazgos identificados en las evaluaciones<\u002Fp>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <div style=\"display:flex;flex-direction:column;gap:13px\">\n                    <div style=\"border:1px solid #F1ECDD;border-left:4px solid #1B7F43;border-radius:8px;padding:13px 14px;background:#FFFDF5\">\n                      <div style=\"font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:900;color:#1B5E32;margin-bottom:6px\">Positivos<\u002Fdiv>\n                      <p style=\"margin:0;font-size:13px;line-height:1.6;color:#1E1E1E;font-weight:300;text-wrap:pretty\">Los estudiantes destacan principalmente la claridad de las explicaciones, el dominio de la materia y la disposición del docente para atender dudas fuera de clase.<\u002Fp>\n                    <\u002Fdiv>\n                    <div style=\"border:1px solid #F1ECDD;border-left:4px solid #E3C924;border-radius:8px;padding:13px 14px;background:#FFFDF5\">\n                      <div style=\"font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:900;color:#8A6F00;margin-bottom:6px\">Por mejorar<\u002Fdiv>\n                      <p style=\"margin:0;font-size:13px;line-height:1.6;color:#1E1E1E;font-weight:300;text-wrap:pretty\">Los comentarios sugieren fortalecer la retroalimentación de los trabajos calificados y diversificar los recursos didácticos usados en clase.<\u002Fp>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <div style=\"margin-top:16px;padding-top:14px;border-top:1px solid #F1ECDD\">\n                    <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px\">\n                      <span style=\"font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:900;color:#66625A\">Pendientes de validación<\u002Fspan>\n                      <button sc-camel-on-click=\"{{ irIA }}\" style=\"padding:0;border:0;background:transparent;color:#053686;font-size:12px;font-weight:900;cursor:pointer;text-decoration:underline\">Abrir DocentIA Insights<\u002Fbutton>\n                    <\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:6px\">\n                      <sc-for list=\"{{ colaIA }}\" as=\"c\" hint-placeholder-count=\"3\">\n                        <button sc-camel-on-click=\"{{ c.go }}\" style=\"display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 11px;border:1px solid #E6DFCE;border-radius:8px;background:#FFFFFF;cursor:pointer\">\n                          <span style=\"width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:#C9A812\"><\u002Fspan>\n                          <span style=\"flex:1;min-width:0;font-size:12.5px;font-weight:400;color:#1E1E1E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ c.docente }}<\u002Fspan>\n                          <span style=\"font-size:11.5px;font-weight:300;color:#66625A;white-space:nowrap\">{{ c.estado }}<\u002Fspan>\n                        <\u002Fbutton>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <sc-if value=\"{{ disclaimer }}\" hint-placeholder-val=\"{{ true }}\">\n                    <p style=\"margin:14px 0 0 0;font-size:11.5px;color:#66625A;line-height:1.5;font-weight:300\">Resumen generado por DocentIA a partir de los comentarios del periodo. Texto de ejemplo para el maquetado: no emite calificación y requiere validación del coordinador.<\u002Fp>\n                  <\u002Fsc-if>\n                <\u002Fsection>\n\n                <section style=\"background:#FFFFFF;border:1px solid #E6DFCE;border-radius:10px;padding:18px;min-width:0;box-shadow:0 1px 2px rgba(30,30,30,.04)\">\n                  <h2 style=\"margin:0;font-size:15.5px;font-weight:900;letter-spacing:-.3px\">Docentes que requieren atención<\u002Fh2>\n                  <p style=\"margin:5px 0 16px 0;font-size:12.5px;color:#66625A;font-weight:300\">Seguimiento académico: no es una sanción, es una señal para acompañar<\u002Fp>\n\n                  <sc-if value=\"{{ hayAtencion }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"display:flex;flex-direction:column;gap:11px\">\n                      <sc-for list=\"{{ atencion }}\" as=\"a\" hint-placeholder-count=\"3\">\n                        <div style=\"border:1px solid #F1ECDD;border-radius:9px;padding:13px 14px;background:#FFFDF5\">\n                          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap\">\n                            <strong style=\"font-size:13.5px;font-weight:900;letter-spacing:-.2px\">{{ a.nombre }}<\u002Fstrong>\n                            <span style=\"display:flex;align-items:baseline;gap:10px;white-space:nowrap\">\n                              <span style=\"font-size:13px;font-weight:900\">{{ a.valor }} / 5<\u002Fspan>\n                              <span style=\"font-size:12px;font-weight:900;color:{{ a.tendFg }}\">{{ a.tend }}<\u002Fspan>\n                            <\u002Fspan>\n                          <\u002Fdiv>\n                          <div style=\"font-size:11.5px;font-weight:300;color:#66625A;margin-top:3px\">{{ a.programa }}<\u002Fdiv>\n                          <p style=\"margin:8px 0 0 0;font-size:12.5px;color:#3A3733;line-height:1.5;font-weight:300\">{{ a.motivo }}<\u002Fp>\n                          <button sc-camel-on-click=\"{{ a.ver }}\" style=\"margin-top:11px;padding:8px 13px;border:1px solid #053686;border-radius:7px;background:#FFFFFF;color:#053686;font-size:12.5px;font-weight:900;cursor:pointer\">Revisar resultados<\u002Fbutton>\n                        <\u002Fdiv>\n -block\">\n                            <span style=\"display:block;height:100%;width:{{ r.pct }};background:{{ r.color }};border-radius:4px\"><\u002Fspan>\n                          <\u002Fspan>\n                          <strong style=\"font-size:13.5px;font-weight:900;letter-spacing:-.3px;width:30px;text-align:left\">{{ r.prom }}<\u002Fstrong>\n                        <\u002Fspan>\n                      <\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:11px 14px;white-space:nowrap\">\n                        <span style=\"font-size:11.5px;font-weight:900;padding:4px 9px;border-radius:20px;background:{{ r.badgeBg }};color:{{ r.badgeFg }}\">{{ r.estado }}<\u002Fspan>\n                      <\u002Fsc-raw-td>\n                      <sc-raw-td style=\"padding:11px 14px;text-align:right;font-size:17px;color:#66625A\">›<\u002Fsc-raw-td>\n                    <\u002Fsc-raw-tr>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-tbody>\n              <\u002Fsc-raw-table>\n            <\u002Fdiv>\n            <sc-if value=\"{{ empty }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:46px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center\">\n                <img src=\"4a73c8f1-6650-4b9a-b06b-cf44bb520e46\" alt=\"\" aria-hidden=\"true\" style=\"width:80px;height:auto\">\n                <strong style=\"font-size:15px;font-weight:900\">Ningún docente coincide con el filtro<\u002Fstrong>\n                <p style=\"margin:0;font-size:13px;color:#66625A;max-width:36ch\">Prueba con otro programa o limpia la búsqueda para ver los 142 docentes del periodo.<\u002Fp>\n                <button sc-camel-on-click=\"{{ clearFilters }}\" style=\"padding:9px 15px;border:1px solid #053686;border-radius:8px;background:#fff;color:#053686;font-size:13px;font-weight:900;cursor:pointer\">Limpiar filtros<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ======================= PERFIL DOCENTE ======================= -->\n      <sc-if value=\"{{ isPerfil }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:16px\">\n          <button sc-camel-on-click=\"{{ backToList }}\" style=\"align-self:flex-start;padding:7px 13px;border:1px solid #E6DFCE;border-radius:8px;background:#fff;font-size:12.5px;font-weight:900;cursor:pointer;color:#053686\">‹ Volver al listado<\u002Fbutton>\n\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start\">\n            <section style=\"background:#fff;border:1px solid #E6DFCE;border-radius:12px;padding:20px\">\n              <div style=\"display:flex;gap:14px;align-items:center;margin-bottom:18px\">\n                <div style=\"width:60px;height:60px;flex:0 0 60px;border-radius:50%;background:#053686;color:#FFFDF5;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900\">{{ sel.ini }}<\u002Fdiv>\n                <div style=\"min-width:0\">\n                  <h2 style=\"margin:0;font-size:20px;font-weight:900;letter-spacing:-.6px;line-height:1.15\">{{ sel.nombre }}<\u002Fh2>\n                  <p style=\"margin:3px 0 0 0;font-size:13px;color:#6E6A5E;font-weight:300\">{{ sel.categoria }} · {{ sel.programa }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:10px\">\n                <sc-for list=\"{{ perfilMeta }}\" as=\"m\" hint-placeholder-count=\"4\">\n                  <div style=\"border:1px solid #F1ECDD;border-radius:9px;padding:10px 12px;background:#FFFDF5\">\n                    <div style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:900;color:#66625A;margin-bottom:3px\">{{ m.k }}<\u002Fdiv>\n                    <div style=\"font-size:13.5px;font-weight:900\">{{ m.v }}<\u002Fdiv>\ div style=\"height:8px;background:#F1ECDD;border-radius:3px;overflow:hidden;margin-top:11px\">\n                      <div style=\"height:100%;width:{{ a.w }};background:{{ a.color }};border-radius:3px\"><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <div style=\"margin-top:18px;padding-top:15px;border-top:1px solid #F1ECDD\">\n                <label for=\"obsCoord\" style=\"display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:900;color:#66625A;margin-bottom:7px\">Observación para la reunión (opcional)<\u002Flabel>\n                <textarea id=\"obsCoord\" value=\"{{ obsCoord }}\" sc-camel-on-input=\"{{ onObsCoord }}\" placeholder=\"Queda en el acta y el docente sí la leerá.\" style=\"width:100%;min-height:78px;border:1px solid #E6DFCE;border-radius:9px;padding:11px 13px;font-size:13px;line-height:1.6;color:#1E1E1E;background:#FFFDF5;resize:vertical;font-weight:300\"><\u002Ftextarea>\n              <\u002Fdiv>\n            <\u002Fsection>\n\n            <div style=\"display:flex;flex-direction:column;gap:16px;min-width:0\">\n\n              <section style=\"background:#053686;color:#FFFDF5;border-radius:10px;padding:20px\">\n                <div style=\"font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:900;opacity:.75;margin-bottom:10px\">Tu calificación<\u002Fdiv>\n                <div style=\"display:flex;align-items:baseline;gap:8px\">\n                  <strong style=\"font-size:44px;font-weight:900;letter-spacing:-2.2px;line-height:1\">{{ notaCoordCalc }}<\u002Fstrong>\n                  <span style=\"font-size:15px;font-weight:300;opacity:.8\">/ 5,0<\u002Fspan>\n                <\u002Fdiv>\n                <p style=\"margin:12px 0 0 0;font-size:12.5px;font-weight:300;opacity:.85;line-height:1.55\">Promedio simple de los cinco aspectos que calificaste.<\u002Fp>\n              <\u002Fsection>\n\n    <\u002Fdiv>\n\n          <section style=\"background:#FFFDF5;border:2px solid #053686;border-radius:10px;padding:18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap\">\n            <div style=\"flex:1 1 220px;min-width:220px\">\n              <strong style=\"font-size:14px;font-weight:900;letter-spacing:-.2px\">{{ pasoTitulo }}<\u002Fstrong>\n              <p style=\"margin:4px 0 0 0;font-size:12.5px;color:#3A3733;font-weight:300;line-height:1.5\">{{ pasoDetalle }}<\u002Fp>\n            <\u002Fdiv>\n            <button sc-camel-on-click=\"{{ pasoGo }}\" style=\"padding:11px 18px;border:0;border-radius:8px;background:#053686;color:#FFFDF5;font-size:13.5px;font-weight:900;cursor:pointer;white-space:nowrap\">{{ pasoCta }}<\u002Fbutton>\n          <\u002Fsection>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ======================= ACTA Y FIRMA (PROFESOR) ======================= -->\n      <sc-if value=\"{{ isActa }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start\">\n\n          <div style=\"display:flex;flex-direction:column;gap:16px;min-width:0\">\n\n            <section style=\"background:#FFFFFF;border:1px solid #E6DFCE;border-radius:10px;padding:18px\">\n              <div style=\"display:flex;align-items:center;gap:11px;flex-wrap:wrap\">\n                <span style=\"font-size:11.5px;font-weight:900;padding:5px 11px;border-radius:20px;background:{{ ramaBg }};color:{{ ramaFg }}\">{{ ramaBadge }}<\u002Fspan>\n                <span style=\"font-size:12.5px;font-weight:300;color:#3A3733\">Promedio del periodo: <strong style=\"font-weight:900;color:#1E1E1E\">{{ notaFmt }} / 5,0<\u002Fstrong><\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"margin:12px 0 0 0;font-size:13px;color:#3A3733;font-weight:300;line-height:1.6;text-wrap:pretty\">{{ ramaExplica }}<\u002Fp>\n            <\u002Fsection>\n\n            <sc-if value=\" nd:#FFFFFF;border:1px solid #E6DFCE;border-radius:10px;padding:20px\">\n                <h2 style=\"margin:0;font-size:15.5px;font-weight:900;letter-spacing:-.3px\">Compromisos que asumes<\u002Fh2>\n                <p style=\"margin:5px 0 16px 0;font-size:12.5px;color:#66625A;font-weight:300\">Propuestos por tu coordinadora a partir de los hallazgos. Marca los que asumes; puedes añadir uno propio.<\u002Fp>\n\n                <div style=\"display:flex;flex-direction:column;gap:10px\">\n                  <sc-for list=\"{{ propuestas }}\" as=\"p\" hint-placeholder-count=\"3\">\n                    <button sc-camel-on-click=\"{{ p.toggle }}\" aria-pressed=\"{{ p.on }}\" style=\"display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;min-height:44px;padding:13px 14px;border:{{ p.bd }};border-radius:9px;background:{{ p.bg }};cursor:pointer\">\n                      <span style=\"width:22px;height:22px;flex:0 0 22px;border-radius:5px;border:2px solid {{ p.boxBd }};background:{{ p.boxBg }};color:#FFFDF5;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;margin-top:1px\">{{ p.mark }}<\u002Fspan>\n                      <span style=\"min-width:0\">\n                        <span style=\"display:block;font-size:13.5px;font-weight:900;letter-spacing:-.2px;color:#1E1E1E\">{{ p.titulo }}<\u002Fspan>\n                        <span style=\"display:block;font-size:12.5px;color:#3A3733;font-weight:300;line-height:1.5;margin-top:3px\">{{ p.detalle }}<\u002Fspan>\n                        <span style=\"display:block;font-size:11px;font-weight:900;color:#66625A;margin-top:6px\">Plazo propuesto: {{ p.plazo }}<\u002Fspan>\n                      <\u002Fspan>\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n\n                <div style=\"margin-top:16px;padding-top:14px;border-top:1px solid #F1ECDD\">\n                  <label for=\"acLibre\" style=\"display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:900;color:#66625A;margin-bottom:7px\">Compromiso propio (opcional)<\u002Flabel>\n                  <textarea id=\"acLibre\" value=\"{{ acuerdoLibre }}\" sc-camel-on-input=\"{{ onAcuerdoLibre }}\" placeholder=\"Ej.: publicar la rúbrica de cada parcial antes de su aplicación\" style=\"width:100%;min-height:72px;border:1px solid #E6DFCE;border-radius:9px;padding:11px 13px;font-size:13px;line-height:1.6;color:#1E1E1E;background:#FFFDF5;resize:vertical;font-weight:300\"><\u002Ftextarea>\n                <\u002Fdiv>\n\n                <p style=\"margin:14px 0 0 0;font-size:12.5px;font-weight:900;color:{{ nAcuerdosFg }}\">{{ nAcuerdosTexto }}<\u002Fp>\n              <\u002Fsection>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ esRamaLectura }}\" hint-placeholder-val=\"{{ true }}\">\n              <section style=\"background:#FFFFFF;border:1px solid #E6DFCE;border-radius:10px;padding:20px\">\n                <h2 style=\"margin:0;font-size:15.5px;font-weight:900;letter-spacing:-.3px\">Declaración de lectura<\u002Fh2>\n                <p style=\"margin:5px 0 16px 0;font-size:12.5px;color:#66625A;font-weight:300\">Al firmar esta acta declaras lo siguiente<\u002Fp>\n                <div style=\"display:flex;flex-direction:column;gap:11px\">\n                  <sc-for list=\"{{ declaraciones }}\" as=\"d\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex;gap:11px;align-items:flex-start\">\n                      <span style=\"width:20px;height:20px;flex:0 0 20px;border-radius:50%;background:#EAF6EE;color:#1B5E32;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;margin-top:1px\">✓<\u002Fspan>\n                      <span style=\"font-size:13px;color:#1E1E1E;font-weight:300;line-height:1.55;min-width:0\">{{ d }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <p style=\"margin:15px 0 0 0;font-size:12.5px;color:#3A3733;font-weight:300;line-height:1.55\">No se registran compromisos de mejora obligatorios. Si quieres dejar constancia de una acción voluntaria, puedes indicarlo en la reunión y tu coordinadora la añadirá al acta.<\u002Fp>\n              <\u002Fsection>\n            <\u002Fsc-if>\n\n            <section style=\"background:#FFFFFF;border:1px solid #E6DFCE;border-radius:10px;padding:20px\">\n              <h2 style=\"margin:0;font-size:15.5px;font-weight:900;letter-spacing:-.3px\">Firma digital<\u002Fh2>\n              <p style=\"margin:5px 0 18px 0;font-size:12.5px;color:#66625A;font-weight:300\">Firma electrónica simple: tu nombre, tu documento y tu consentimiento quedan asociados al acta con fecha, hora y código de verificación.<\u002Fp>\n\n              <sc-if value=\"{{ noFirmado }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display:flex;flex-direction:column;gap:14px\">\n                  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px\">\n                    <div style=\"display:flex;flex-direction:column;gap:6px;min-width:0\">\n                      <label for=\"fNombre\" style=\"font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:900;color:#66625A\">Nombre completo<\u002Flabel>\n                      <input id=\"fNombre\" value=\"{{ firmaNombre }}\" sc-camel-on-input=\"{{ onFirmaNombre }}\" placeholder=\"Elena Duarte Rivas\" style=\"padding:11px 12px;border:1px solid #E6DFCE;border-radius:8px;background:#FFFDF5;font-size:13.5px;font-weight:400;color:#1E1E1E;width:100%\">\n                    <\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:6px;min-width:0\">\n                      <label for=\"fCC\" style=\"font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:900;color:#66625A\">Documento de identidad<\u002Flabel>\n                      <input id=\"fCC\" value=\"{{ firmaCC }}\" sc-camel-on-input=\"{{ onFirmaCC }}\" placeholder=\"1.032.884\" style=\"padding:11px 12px;border:1px solid #E6DFCE;border-radius:8px;background:#FFFDF5;font-size:13.5px;font-weight:400;color:#1E1E1E;width:100%\">\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <div style=\"border:1px dashed #D8D0BC;border-radius:9px;padding:18px 16px;background:#FFFDF5\">\n                    <div style=\"font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:900;color:#66625A;margin-bottom:10px\">Vista previa de la firma<\u002Fdiv>\n                    <div style=\"font-size:27px;font-weight:300;font-style:italic;letter-spacing:-.5px;color:{{ previewFg }};line-height:1.2;min-height:34px;word-break:break-word\">{{ firmaPreview }}<\u002Fdiv>\n                    <div style=\"height:2px;background:#1E1E1E;margin:10px 0 8px 0\"><\u002Fdiv>\n                    <div style=\"font-size:11.5px;font-weight:300;color:#66625A\">C.C. {{ firmaCCPreview }} · Docente<\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <button sc-camel-on-click=\"{{ toggleConsent }}\" aria-pressed=\"{{ firmaConsent }}\" style=\"display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;min-height:44px;padding:13px 14px;border:{{ consentBd }};border-radius:9px;background:{{ consentBg }};cursor:pointer\">\n                    <span style=\"width:22px;height:22px;flex:0 0 22px;border-radius:5px;border:2px solid {{ consentBoxBd }};background:{{ consentBoxBg }};color:#FFFDF5;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;margin-top:1px\">{{ consentMark }}<\u002Fspan>\n                    <span style=\"font-size:12.5px;color:#1E1E1E;font-weight:300;line-height:1.55;min-width:0\">{{ consentTexto }}<\u002Fspan>\n                  <\u002Fbutton>\n\n                  <div style=\"display:flex;align-items:center;gap:13px;flex-wrap:wrap\">\n                    <button sc-camel-on-click=\"{{ firmar }}\" disabled=\"{{ firmaBloqueada }}\" style=\"padding:12px 20px;border:0;border-radius:9px;background:{{ firmarBg }};color:{{ firmarFg }};font-size:13.5px;font-weight:900;cursor:{{ firmarCursor }};opacity:{{ firmarOpacity }};min-height:44px\">Firmar el acta<\u002Fbutton>\n                    <span style=\"font-size:12px;color:#66625A;font-weight:300;line-height:1.5;flex:1 1 200px;min-width:200px\">{{ firmaAyuda }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ firmado }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;flex-direction:column;gap:16px\">\n                  <div style=\"display:flex;align-items:center;gap:14px;padding:15px 16px;border-radius:9px;background:#EAF6EE;border:1px solid #BFE3CC;flex-wrap:wrap\">\n                    <img src=\"4864bd1d-98b5-46d9-9371-558c554e758e\" alt=\"\" aria-hidden=\"true\" style=\"width:50px;height:auto;flex:0 0 50px\">\n                    <div style=\"flex:1 1 200px;min-width:200px\">\n                      <strong style=\"font-size:13.5px;font-weight:900;color:#1B5E32\">Acta firmada el 15 de septiembre de 2026, 10:24<\u002Fstrong>\n                      <div style=\"font-size:12.5px;color:#3C7A52;font-weight:300;line-height:1.5;margin-top:3px\">Código de verificación {{ codigoFirma }} · firmada por {{ firmaPreview }}, C.C. {{ firmaCCPreview }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <div style=\"display:flex;gap:9px;flex-wrap:wrap\">\n                    <button sc-camel-on-click=\"{{ generarPdf }}\" style=\"padding:12px 18px;border:0;border-radius:9px;background:#053686;color:#FFFDF5;font-size:13.5px;font-weight:900;cursor:pointer;min-height:44px\">Descargar acta en PDF<\u002Fbutton>\n                    <button sc-camel-on-click=\"{{ deshacerFirma }}\" style=\"padding:12px 16px;border:1px solid #E6DFCE;border-radius:9px;background:#FFFFFF;color:#66625A;font-size:13px;font-weight:900;cursor:pointer;min-height:44px\">Solicitar corrección<\u002Fbutton>\n                  <\u002Fdiv>\n\n                  <sc-if value=\"{{ pdfListo }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;align-items:center;gap:12px;padding:13px 15px;border:1px solid #C7D3EC;border-radius:9px;background:#E8EDF8;flex-wrap:wrap\">\n                      <span style=\"width:34px;height:40px;flex:0 0 34px;border:2px solid #053686;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:900;color:#053686;background:#FFFFFF\">PDF<\u002Fspan>\n                      <div style=\"flex:1 1 200px;min-width:200px\">\n                        <strong style=\"font-size:13px;font-weight:900;color:#053686;word-break:break-all\">{{ pdfNombre }}<\u002Fstrong>\n                        <div style=\"font-size:11.5px;color:#3A3733;font-weight:300;margin-top:2px\">{{ pdfPeso }} · descargado ahora · copia enviada a tu correo institucional<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fsection>\n          <\u002Fdiv>\n\n          <aside style=\"background:#FFFFFF;border:1px solid #E6DFCE;border-radius:10px;padding:20px;min-width:0\">\n            <div style=\"font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:900;color:#66625A;margin-bottom:14px\">Vista previa del acta<\u002Fdiv>\n\n            <div style=\"border:1px solid #E6DFCE;background:#FFFFFF;padding:20px 18px\">\n              <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:2px solid #1E1E1E;margin-bottom:14px\">\n                <div style=\"min-width:0\">\n                  <div style=\"font-size:13px;font-weight:900;letter-spacing:-.3px;line-height:1.25\">{{ actaTitulo }}<\u002Fdiv>\n                  <div style=\"font-size:10.5px;font-weight:300;color:#66625A;margin-top:3px\">Corporación Universitaria Autónoma del Cauca<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:10px;font-weight:900;color:#66625A;text-align:right;white-space:nowrap\">{{ actaCodigo }}<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;flex-direction:column;gap:9px;margin-bottom:14px\">\n                <sc-for list=\"{{ actaMeta }}\" as=\"m\" hint-placeholder-count=\"5\">\n                  <div style=\"display:flex;gap:8px;align-items:baseline\">\n                    <span style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:900;color:#66625A;width:82px;flex:0 0 82px\">{{ m.k }}<\u002Fspan>\n                    <span style=\"font-size:11.5px;font-weight:400;color:#1E1E1E;min-width:0\">{{ m.v }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <div style=\"font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:900;color:#66625A;padding-top:12px;border-top:1px solid #E6DFCE;margin-bottom:8px\">{{ actaCuerpoTitulo }}<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:7px\">\n                <sc-for list=\"{{ actaCuerpo }}\" as=\"c\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;gap:8px;align-items:flex-start\">\n                    <span style=\"font-size:11px;font-weight:900;color:#053686;flex:0 0 14px\">{{ c.n }}<\u002Fspan>\n                    <span style=\"font-size:11.5px;font-weight:300;color:#1E1E1E;line-height:1.55;min-width:0\">{{ c.texto }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <div style=\"margin-top:20px;padding-top:14px;border-top:1px solid #E6DFCE\">\n                <div style=\"font-size:18px;font-weight:300;font-style:italic;color:{{ actaFirmaFg }};min-height:24px;line-height:1.2;word-break:break-word\">{{ actaFirma }}<\u002Fdiv>\n                <div style=\"height:1px;background:#1E1E1E;margin:7px 0 6px 0\"><\u002Fdiv>\n                <div style=\"font-size:10px;font-weight:300;color:#66625A;line-height:1.5\">{{ actaFirmaPie }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <p style=\"margin:14px 0 0 0;font-size:11px;color:#66625A;line-height:1.5;font-weight:300\">Documento de ejemplo para el maquetado. El PDF definitivo lo emite el sistema con el sello institucional y el código de verificación de la firma.<\u002Fp>\n          <\u002Faside>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ======================= MI CITA (PROFESOR) ======================= -->\n      <sc-if value=\"{{ isCitas }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start\">\n\n          <section style=\"background:#fff;border:1px solid #E6DFCE;border-radius:12px;padding:20px\">\n            <h2 style=\"margin:0 0 3px 0;font-size:15.5px;font-weight:900;letter-spacing:-.3px\">Turnos que dejó tu coordinadora<\u002Fh2>\n            <p style=\"margin:0 0 16px 0;font-size:12px;color:#66625A\">Ana María Ríos abrió {{ nPublicados }} franjas de 30 minutos. Elige una: puedes cambiarla hasta 24 horas antes.<\u002Fp>\n\n            <sc-if value=\"{{ hayLibres }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;flex-direction:column;gap:14px\">\n                <sc-for list=\"{{ citaDias }}\" as=\"d\" hint-placeholder-count=\"4\">\n                  <div>\n                    <div style=\"font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:900;color:#66625A;padding-bottom:8px;border-bottom:1px solid #F1ECDD;margin-bottom:9px\">{{ d.dia }}<\u002Fdiv>\n                    <div style=\"display:flex;gap:7px;flex-wrap:wrap\">\n                      <sc-for list=
