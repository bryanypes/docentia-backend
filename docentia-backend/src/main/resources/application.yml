spring:
  application:
    name: docentia
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DOCENTIA_DB_URL:jdbc:postgresql://localhost:5432/docentia}
    username: ${DOCENTIA_DB_USUARIO:docentia}
    password: ${DOCENTIA_DB_CONTRASENA:docentia}
    hikari:
      maximum-pool-size: ${DOCENTIA_DB_POOL_MAXIMO:15}
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  task:
    scheduling:
      # El análisis puede tardar un minuto y no debe frenar el correo.
      pool:
        size: 3
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Un poco más que docentia.importacion.tamano-maximo-bytes para que el límite propio, con
      # su mensaje claro, actúe antes que el del servidor.
      max-file-size: 3MB
      max-request-size: 4MB

server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: false

docentia:
  jwt:
    secreto: ${DOCENTIA_JWT_SECRETO:}
    minutos-vigencia: 480
  google:
    client-id: ${DOCENTIA_GOOGLE_CLIENT_ID:}
  # Orígenes exactos, separados por coma, que pueden llamar al API desde otro dominio. Vacío = sin
  # CORS (el frontend va en el mismo origen o detrás de un proxy, como Vite en desarrollo).
  cors:
    origenes-permitidos: ${DOCENTIA_CORS_ORIGENES:}
  importacion:
    tamano-maximo-bytes: 2097152
    filas-maximas: 5000

  kpi:
    destacado-umbral: 4.5
  # Con una nota menor al umbral el acta exige al menos un compromiso con plazo.
  compromisos:
    umbral: ${DOCENTIA_COMPROMISOS_UMBRAL:3.8}
  # Rol que puede corregir un acta firmada (VICERRECTOR o COORDINADOR).
  actas:
    rol-corrector: ${DOCENTIA_ACTAS_ROL_CORRECTOR:VICERRECTOR}
  # Avisos dentro de la app y correo. Sin DOCENTIA_MAIL_HOST los correos solo se registran.
  notificaciones:
    url-aplicacion: ${DOCENTIA_APP_URL:http://localhost:5173}
    retencion-dias: ${DOCENTIA_NOTIFICACIONES_RETENCION_DIAS:90}
    lote-correo: 20
    correo:
      host: ${DOCENTIA_MAIL_HOST:}
      puerto: ${DOCENTIA_MAIL_PORT:587}
      usuario: ${DOCENTIA_MAIL_USER:}
      contrasena: ${DOCENTIA_MAIL_PASS:}
      remitente: ${DOCENTIA_MAIL_FROM:no-responder@uniautonoma.edu.co}
      tls: ${DOCENTIA_MAIL_TLS:true}
  # Análisis de comentarios con IA (E1). Apagado por defecto: enviar comentarios a un proveedor
  # externo exige revisar la política de tratamiento de datos de la universidad (Ley 1581 de 2012).
  ia:
    habilitado: ${DOCENTIA_IA_HABILITADO:false}
    proveedor: ${DOCENTIA_IA_PROVEEDOR:simulado}
    url-base: ${DOCENTIA_IA_URL_BASE:}
    modelo: ${DOCENTIA_IA_MODELO:}
    timeout-segundos: ${DOCENTIA_IA_TIMEOUT_SEGUNDOS:60}
    clave: ${DOCENTIA_IA_CLAVE:}
    minimo-encuestas: 10
    worker:
      habilitado: ${DOCENTIA_IA_WORKER:true}
      intervalo-ms: 5000
