spring:
  application:
    name: docentia
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DOCENTIA_DB_URL:jdbc:postgresql://localhost:5432/docentia}
    username: ${DOCENTIA_DB_USUARIO:docentia}
    password: ${DOCENTIA_DB_CONTRASENA:docentia}
    hikari:
      maximum-pool-size: ${DOCENTIA_DB_POOL_MAXIMO:15}
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Carga las relaciones perezosas en lotes: evita una consulta por fila en los listados.
        default_batch_fetch_size: 50
  task:
    scheduling:
      # El análisis puede tardar un minuto y no debe frenar el correo.
      pool:
        size: 3
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Un poco más que docentia.importacion.tamano-maximo-bytes para que el límite propio, con
      # su mensaje claro, actúe antes que el del servidor.
      max-file-size: 3MB
      max-request-size: 4MB

server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    mail:
      enabled: false

docentia:
  jwt:
    secreto: ${DOCENTIA_JWT_SECRETO:}
    minutos-vigencia: 480
  google:
    client-id: ${DOCENTIA_GOOGLE_CLIENT_ID:}
  # Primer usuario fuera de dev (docs/OPERACION.md): crea un VICERRECTOR solo si no hay usuarios.
  bootstrap:
    email: ${DOCENTIA_BOOTSTRAP_EMAIL:}
    nombre: ${DOCENTIA_BOOTSTRAP_NOMBRE:}
    contrasena: ${DOCENTIA_BOOTSTRAP_CONTRASENA:}
  # Orígenes exactos, separados por coma, que pueden llamar al API desde otro dominio. Vacío = sin
  # CORS (el frontend va en el mismo origen o detrás de un proxy, como Vite en desarrollo).
  cors:
    origenes-permitidos: ${DOCENTIA_CORS_ORIGENES:}
  importacion:
    tamano-maximo-bytes: 2097152
    filas-maximas: 5000

  kpi:
    destacado-umbral: 4.5
  # Con una nota menor al umbral el acta exige al menos un compromiso con plazo.
  compromisos:
    umbral: ${DOCENTIA_COMPROMISOS_UMBRAL:3.8}
  # Heteroevaluación: por debajo del mínimo no se usa ni se muestra ningún agregado.
  heteroevaluacion:
    minimo-respuestas: ${DOCENTIA_HETEROEVALUACION_MINIMO:5}
  # Escala de los formularios, de 1 a 5. La resolución no la define: pendiente de confirmar.
  formularios:
    etiquetas-escala: Muy en desacuerdo,En desacuerdo,Ni de acuerdo ni en desacuerdo,De acuerdo,Muy de acuerdo
  # Nombre automático del periodo: AAAA-1 si inicia hasta este mes, AAAA-2 después. Por confirmar.
  periodos:
    mes-fin-primer-semestre: ${DOCENTIA_PERIODOS_MES_FIN_PRIMER_SEMESTRE:6}
  # Rol que puede corregir un acta firmada (VICERRECTOR o COORDINADOR).
  actas:
    rol-corrector: ${DOCENTIA_ACTAS_ROL_CORRECTOR:VICERRECTOR}
    # La firma lleva el trazo dibujado en la página; se imprime en el PDF con su hash.
    exigir-firma-dibujada: ${DOCENTIA_ACTAS_EXIGIR_FIRMA_DIBUJADA:true}
    # Logo institucional del PDF (ver resources/marca/LEEME.md). Sin archivo, el acta sale sin logo.
    logo: ${DOCENTIA_ACTAS_LOGO:classpath:marca/logo-uniautonoma.png}
  # El docente ve su nota, compromisos y acta solo cuando la coordinación registra su asistencia a la
  # cita, y el acta se firma en esa reunión.
  proceso:
    exigir-asistencia: ${DOCENTIA_PROCESO_EXIGIR_ASISTENCIA:true}
  # Avisos dentro de la app y correo. Sin DOCENTIA_MAIL_HOST los correos solo se registran.
  notificaciones:
    url-aplicacion: ${DOCENTIA_APP_URL:http://localhost:5173}
    retencion-dias: ${DOCENTIA_NOTIFICACIONES_RETENCION_DIAS:90}
    lote-correo: 20
    correo:
      host: ${DOCENTIA_MAIL_HOST:}
      puerto: ${DOCENTIA_MAIL_PORT:587}
      usuario: ${DOCENTIA_MAIL_USER:}
      contrasena: ${DOCENTIA_MAIL_PASS:}
      remitente: ${DOCENTIA_MAIL_FROM:no-responder@uniautonoma.edu.co}
      tls: ${DOCENTIA_MAIL_TLS:true}
  # Análisis de comentarios con IA (E1). Apagado por defecto: enviar comentarios a un proveedor
  # externo exige revisar la política de tratamiento de datos de la universidad (Ley 1581 de 2012).
  ia:
    habilitado: ${DOCENTIA_IA_HABILITADO:false}
    proveedor: ${DOCENTIA_IA_PROVEEDOR:local}
    url-base: ${DOCENTIA_IA_URL_BASE:}
    modelo: ${DOCENTIA_IA_MODELO:}
    timeout-segundos: ${DOCENTIA_IA_TIMEOUT_SEGUNDOS:60}
    clave: ${DOCENTIA_IA_CLAVE:}
    enviar-temperatura: ${DOCENTIA_IA_ENVIAR_TEMPERATURA:true}
    # Ahorro de tokens del proveedor externo (docs/ANALISIS_IA_COSTOS.md). Presupuesto 0 = sin tope.
    max-comentarios-llm: ${DOCENTIA_IA_MAX_COMENTARIOS_LLM:150}
    max-caracteres-comentario: ${DOCENTIA_IA_MAX_CARACTERES_COMENTARIO:300}
    max-tokens-entrada: ${DOCENTIA_IA_MAX_TOKENS_ENTRADA:16000}
    max-tokens-salida: ${DOCENTIA_IA_MAX_TOKENS_SALIDA:4000}
    presupuesto-tokens-dia: ${DOCENTIA_IA_PRESUPUESTO_TOKENS_DIA:500000}
    presupuesto-tokens-periodo: ${DOCENTIA_IA_PRESUPUESTO_TOKENS_PERIODO:3000000}
    enfriamiento-regeneracion-minutos: 60
    periodos-referencia: 1
    precio-millon-tokens-entrada: ${DOCENTIA_IA_PRECIO_MILLON_ENTRADA:}
    precio-millon-tokens-salida: ${DOCENTIA_IA_PRECIO_MILLON_SALIDA:}
    minimo-encuestas: 10
    worker:
      habilitado: ${DOCENTIA_IA_WORKER:true}
      intervalo-ms: 5000
